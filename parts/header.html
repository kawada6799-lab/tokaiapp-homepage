<!-- ==========================================================================
     header.html — 全ページ共通のヘッダー
     「無料で相談する」を常時出しておく。スクロールすると
     上段（屋号の説明・連絡先）が畳まれて、1段になって付いてくる。
     ========================================================================== -->
<a class="skip-link" href="#main">本文へ移動</a>

<header class="header" data-header>

  <!-- 上段: 何をしている屋号かと、連絡先 -->
  <div class="header__top">
    <div class="wrap header__top-in">
      <p class="header__contact">
        <!-- メールアドレスはHTMLに直接書かない（収集ボット対策）。
             main.js が data- 属性から組み立てて mailto: にする。
             JavaScriptが動かない環境では、お問い合わせページへのリンクになる -->
        <a href="/contact/" class="header__mail"
           data-mail="info" data-mail-domain="tokaiapp.com">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
            <path d="m3 6.5 9 6.5 9-6.5"/>
          </svg>
          <span data-mail-text>お問い合わせ</span>
        </a>
      </p>
    </div>
  </div>

  <!-- 下段: ロゴ・メニュー・CTA -->
  <div class="header__main">
    <div class="wrap header__main-in">

      <a class="logo" href="/" aria-label="東海App ホーム">
        <img class="logo__mark" src="{{ASSETS}}/img/logo.png"
             width="320" height="202" alt="" decoding="async">
        <span class="logo__text">東海<span>App</span></span>
      </a>

      <button class="nav-toggle" data-nav-toggle aria-expanded="false"
              aria-controls="site-nav" aria-label="メニューを開く">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav" id="site-nav" data-nav aria-label="サイト内メニュー">
        <ul class="nav__list">
          <li><a class="nav__link" href="/service/">サービス</a></li>
          <li><a class="nav__link" href="/price/">料金</a></li>
          <li><a class="nav__link" href="/company/">会社概要</a></li>
          <li><a class="nav__link" href="/news/">お知らせ</a></li>
          <li class="nav__cta-wrap">
            <a class="btn btn--cta btn--sm" href="/contact/">無料で相談する</a>
          </li>
        </ul>
      </nav>

      <a class="btn btn--cta btn--sm header__cta" href="/contact/">無料で相談する</a>
    </div>
  </div>

</header>
